<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/style.css') }}">
    <title>Formulário de Cadastro</title>
</head>
<body>
    <div class="container">
        <div class="form-image">
            <img src="{{ url_for('static', filename='styles/undraw_shopping-bags_nfsf (1).svg') }}" alt="Logo" class="logo">
        </div>

        <div class="form">
            <form id="register-form">
                <div class="form-header">
                    <div class="title">
                        <h1>Cadastre-se</h1>
                    </div>
                    <div class="login-button">
                        <a href="{{ url_for('login_page') }}" class="login-link">Entrar</a>
                    </div>                    
                </div>

                <div class="input-group">
                    <div class="input-box">
                        <label for="nome">Nome</label>
                        <input id="nome" type="text" name="nome" placeholder="Digite seu nome completo" required>
                    </div>

                    <div class="input-box">
                        <label for="cnpj">CNPJ</label>
                        <input id="cnpj" type="text" name="cnpj" placeholder="00.000.000/0000-00" required>
                    </div>

                    <div class="input-box">
                        <label for="email">Email</label>
                        <input id="email" type="email" name="email" placeholder="Digite seu Email" required>
                    </div>

                    <div class="input-box">
                        <label for="celular">Celular</label>
                        <input id="celular" type="tel" name="celular" placeholder="(xx) xxxx-xxxx" required>
                    </div>

                    <div class="input-box">
                        <label for="senha">Senha</label>
                        <input id="senha" type="password" name="senha" placeholder="Digite sua Senha" required>
                    </div>
                </div>

                <div class="continue-button">
                    <button type="submit">Cadastrar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("register-form").addEventListener("submit", async function(event) {
            event.preventDefault();
    
            const formData = new FormData(this);
    
            try {
                const response = await fetch("/api/sellers", {
                    method: "POST",
                    body: formData
                });
    
                const result = await response.json();
    
                if (response.ok) {
                    alert(result.mensagem);
                    window.location.href = result.redirect; // redireciona para tela de ativação
                } else {
                    alert(result.erro || "Erro ao cadastrar.");
                }
            } catch (error) {
                alert("Erro de conexão com o servidor.");
            }
        });
    </script>
</body>
</html>
