<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Excluir Produto</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/delete_product.css') }}">
</head>
<body>

  <header>
    <h1>Excluir Produto</h1>
  </header>

  <div class="container">
    <h2>Excluir Produto</h2>

    <input type="number" id="productId" placeholder="ID do Produto">
    <button onclick="excluirProduto()">Excluir</button>

    <p id="resultado"></p>
  </div>

  <footer>
    <p>© 2025 MS Market Management. Todos os direitos reservados.</p>
    <p>Contato: contato@msmarket.com | (11) 99999-9999</p>
  </footer>

  <script>
    // Recupera o token uma única vez
    const token = localStorage.getItem('token');
    if (!token) {
      document.getElementById('resultado').innerText = "Token não encontrado. Faça login.";
    }

    async function excluirProduto() {
      const productId = document.getElementById('productId').value;
      const resultadoEl = document.getElementById('resultado');

      if (!productId) {
        resultadoEl.innerText = "Por favor, insira o ID do produto.";
        return;
      }

      if (!token) {
        resultadoEl.innerText = "Token de autenticação não encontrado. Faça login novamente.";
        return;
      }

      try {
        const response = await fetch(`http://127.0.0.1:5000/api/products/${productId}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        if (response.ok) {
          const data = await response.json();
          resultadoEl.innerText = data.mensagem || "Produto excluído com sucesso!";
        } else {
          const errorData = await response.json();
          resultadoEl.innerText = errorData.erro || "Erro ao excluir produto.";
        }
      } catch (error) {
        resultadoEl.innerText = "Erro ao conectar com o servidor.";
        console.error(error);
      }
    }
  </script>

</body>
</html>
